name: Deploy Admin Panel (Frontend)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/deploy-frontend-admin.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-admin/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./frontend-admin
        run: npm install

      - name: 🏗️ Build Static Files
        working-directory: ./frontend-admin
        run: npm run generate

      - name: 📂 Sync files via FTP to API /admin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BACKEND_FTP_SERVER }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          local-dir: ./frontend-admin/.output/public/
          server-dir: ${{ secrets.BACKEND_FTP_TARGET_DIR }}admin/
