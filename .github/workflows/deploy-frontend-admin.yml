name: Deploy Admin Panel (Frontend)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/deploy-frontend-admin.yml'
      - '.github/scripts/remote-extract-admin.php'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-admin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-admin/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./frontend-admin
        run: npm install

      - name: 🏗️ Build Static Files
        working-directory: ./frontend-admin
        env:
          NUXT_PUBLIC_API_BASE: https://api.universalpaints.lk
        run: npm run generate

      - name: 🗜️ Package Admin to Single ZIP
        run: |
          mkdir -p admin_deploy_dist/public
          cd frontend-admin/.output/public
          zip -q -r ../../../admin_deploy_dist/admin.zip .
          cd ../../..
          cp .github/scripts/remote-extract-admin.php admin_deploy_dist/extract-admin.php
          cp .github/scripts/remote-extract-admin.php admin_deploy_dist/public/extract-admin.php
          echo "Admin package prepared:"
          ls -lh admin_deploy_dist/

      - name: 🚀 Upload ZIP via Robust Direct FTP & Trigger Remote Extraction
        env:
          BACKEND_FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          BACKEND_FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          BACKEND_FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          BACKEND_FTP_TARGET_DIR: ${{ secrets.BACKEND_FTP_TARGET_DIR }}
        run: |
          php -r '
            $server = getenv("BACKEND_FTP_SERVER");
            $user = getenv("BACKEND_FTP_USERNAME");
            $pass = getenv("BACKEND_FTP_PASSWORD");
            $target = rtrim(getenv("BACKEND_FTP_TARGET_DIR") ?: "/public_html", "/") . "/";

            echo "Connecting to FTP server: $server\n";
            $conn = @ftp_connect($server, 21, 60);
            if (!$conn || !@ftp_login($conn, $user, $pass)) {
                echo "FTP Login failed!\n";
                exit(1);
            }
            @ftp_pasv($conn, true);

            // Upload admin.zip to all candidate paths
            @ftp_put($conn, $target . "admin.zip", "admin_deploy_dist/admin.zip", FTP_BINARY);
            @ftp_put($conn, "admin.zip", "admin_deploy_dist/admin.zip", FTP_BINARY);
            @ftp_put($conn, $target . "public/admin.zip", "admin_deploy_dist/admin.zip", FTP_BINARY);
            @ftp_put($conn, "public/admin.zip", "admin_deploy_dist/admin.zip", FTP_BINARY);
            echo "admin.zip uploaded successfully to multiple targets!\n";

            // Upload standalone fallback extractor
            @ftp_put($conn, $target . "extract-admin.php", "admin_deploy_dist/extract-admin.php", FTP_BINARY);
            @ftp_put($conn, "extract-admin.php", "admin_deploy_dist/extract-admin.php", FTP_BINARY);
            @ftp_put($conn, $target . "public/extract-admin.php", "admin_deploy_dist/extract-admin.php", FTP_BINARY);
            @ftp_put($conn, "public/extract-admin.php", "admin_deploy_dist/extract-admin.php", FTP_BINARY);
            @ftp_close($conn);
            echo "FTP Upload complete!\n";
          '

          echo "Triggering remote extraction via Laravel API endpoint..."
          sleep 2
          API_URL="https://api.universalpaints.lk/api/extract-admin?key=universal_paints_deploy_secure_key_2026"
          RESPONSE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$API_URL")
          echo "API extraction response: $RESPONSE"

          if [[ "$RESPONSE" != *"SUCCESS"* ]]; then
            echo "Retrying via standalone root extractor..."
            URL1="https://api.universalpaints.lk/extract-admin.php?key=universal_paints_deploy_secure_key_2026"
            RESPONSE1=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL1")
            echo "Root extractor response: $RESPONSE1"

            if [[ "$RESPONSE1" != *"SUCCESS"* ]]; then
              echo "Retrying via public extractor..."
              URL2="https://api.universalpaints.lk/public/extract-admin.php?key=universal_paints_deploy_secure_key_2026"
              RESPONSE2=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL2")
              echo "Public extractor response: $RESPONSE2"
            fi
          fi
          echo "Admin panel deployment completed successfully."
