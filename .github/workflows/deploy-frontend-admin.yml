name: Deploy Admin Panel (Frontend)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/deploy-frontend-admin.yml'
      - '.github/scripts/remote-extract-admin.php'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-admin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend-admin/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./frontend-admin
        run: npm install

      - name: 🏗️ Build Static Files
        working-directory: ./frontend-admin
        env:
          NUXT_PUBLIC_API_BASE: https://api.universalpaints.lk
        run: npm run generate

      - name: 🚀 Direct FTP Deployment of Admin Files
        env:
          BACKEND_FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          BACKEND_FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          BACKEND_FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          BACKEND_FTP_TARGET_DIR: ${{ secrets.BACKEND_FTP_TARGET_DIR }}
        run: |
          php -r '
            $server = getenv("BACKEND_FTP_SERVER");
            $user = getenv("BACKEND_FTP_USERNAME");
            $pass = getenv("BACKEND_FTP_PASSWORD");
            $target = rtrim(getenv("BACKEND_FTP_TARGET_DIR") ?: "/public_html", "/") . "/";

            echo "Connecting to FTP server: $server\n";
            $conn = @ftp_connect($server, 21, 60);
            if (!$conn || !@ftp_login($conn, $user, $pass)) {
                echo "FTP Login failed!\n";
                exit(1);
            }
            @ftp_pasv($conn, true);

            function ftp_mkdir_p($conn, $dir) {
                $parts = explode("/", trim(str_replace("\\", "/", $dir), "/"));
                $path = "";
                foreach ($parts as $p) {
                    $path .= "/" . $p;
                    @ftp_mkdir($conn, $path);
                }
            }

            function upload_dir_recursive($conn, $localDir, $remoteDir) {
                ftp_mkdir_p($conn, $remoteDir);
                $files = scandir($localDir);
                foreach ($files as $file) {
                    if ($file === "." || $file === "..") continue;
                    $localPath = $localDir . "/" . $file;
                    $remotePath = rtrim($remoteDir, "/") . "/" . $file;
                    if (is_dir($localPath)) {
                        upload_dir_recursive($conn, $localPath, $remotePath);
                    } else {
                        $success = @ftp_put($conn, $remotePath, $localPath, FTP_BINARY);
                        if (!$success) {
                            @ftp_mkdir_p($conn, dirname($remotePath));
                            $success = @ftp_put($conn, $remotePath, $localPath, FTP_BINARY);
                        }
                    }
                }
            }

            $localBuild = "frontend-admin/.output/public";
            if (!is_dir($localBuild)) {
                echo "Local build directory $localBuild not found!\n";
                exit(1);
            }

            // Sync directly to all candidate locations where Apache might serve /admin
            $targets = [
                $target . "admin",
                $target . "public/admin",
                "public_html/admin",
                "public_html/public/admin",
                "admin",
                "public/admin"
            ];
            $targets = array_unique(array_filter($targets));

            foreach ($targets as $t) {
                echo "Syncing admin files to remote path: $t...\n";
                upload_dir_recursive($conn, $localBuild, $t);
            }

            @ftp_close($conn);
            echo "✅ Direct FTP deployment of Admin Panel completed successfully!\n";
          '
