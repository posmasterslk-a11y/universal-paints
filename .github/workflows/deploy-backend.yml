name: Deploy API Server (Backend)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, gd, ftp, curl
          tools: composer:v2

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: 🗜️ Package Backend to ZIP
        working-directory: ./backend
        run: |
          zip -q -r ../backend.zip . \
            -x ".env*" \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "tests/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"
          echo "backend.zip created successfully! Size:"
          ls -lh ../backend.zip

      - name: 🚀 Upload ZIP & Extract on Remote Server
        run: php .github/scripts/upload-and-extract.php
        env:
          BACKEND_FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          BACKEND_FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          BACKEND_FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          BACKEND_FTP_TARGET_DIR: ${{ secrets.BACKEND_FTP_TARGET_DIR }}
