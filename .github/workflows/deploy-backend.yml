name: Deploy API Server (Backend)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, gd, curl
          tools: composer:v2

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: 🗜️ Package Backend to ZIP
        run: |
          mkdir -p deploy_dist/public
          cd backend
          zip -q -r ../deploy_dist/backend.zip . \
            -x ".env*" \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "tests/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"
          cd ..
          cp .github/scripts/remote-extract.php deploy_dist/public/extract.php
          cp .github/scripts/remote-extract.php deploy_dist/extract.php
          echo "ZIP and Extractor prepared successfully:"
          ls -lh deploy_dist/

      - name: 🚀 Upload ZIP via Robust Direct FTP & Trigger Remote Extraction
        env:
          BACKEND_FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          BACKEND_FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          BACKEND_FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          BACKEND_FTP_TARGET_DIR: ${{ secrets.BACKEND_FTP_TARGET_DIR }}
        run: |
          php -r '
            $server = getenv("BACKEND_FTP_SERVER");
            $user = getenv("BACKEND_FTP_USERNAME");
            $pass = getenv("BACKEND_FTP_PASSWORD");
            $target = rtrim(getenv("BACKEND_FTP_TARGET_DIR") ?: "/public_html", "/") . "/";

            echo "Connecting to FTP server: $server\n";
            $conn = @ftp_connect($server, 21, 60);
            if (!$conn || !@ftp_login($conn, $user, $pass)) {
                echo "FTP Login failed!\n";
                exit(1);
            }
            @ftp_pasv($conn, true);

            function ftp_mkdir_p($conn, $dir) {
                $dir = trim(str_replace("\\", "/", $dir), "/");
                if (empty($dir)) return;
                $parts = explode("/", $dir);
                $path = "";
                foreach ($parts as $p) {
                    $path .= ($path === "" ? "" : "/") . $p;
                    @ftp_mkdir($conn, $path);
                }
            }

            function upload_dir_recursive($conn, $localDir, $remoteDir) {
                ftp_mkdir_p($conn, $remoteDir);
                $files = scandir($localDir);
                foreach ($files as $file) {
                    if ($file === "." || $file === "..") continue;
                    $localPath = $localDir . "/" . $file;
                    $remotePath = rtrim($remoteDir, "/") . "/" . $file;
                    if (is_dir($localPath)) {
                        upload_dir_recursive($conn, $localPath, $remotePath);
                    } else {
                        $success = @ftp_put($conn, $remotePath, $localPath, FTP_BINARY);
                        if (!$success) {
                            ftp_mkdir_p($conn, dirname($remotePath));
                            @ftp_put($conn, $remotePath, $localPath, FTP_BINARY);
                        }
                    }
                }
            }

            // Determine candidate roots on FTP server
            $cwd = @ftp_pwd($conn);
            echo "Current FTP working directory: $cwd\n";
            $rootList = @ftp_nlist($conn, '.') ?: [];
            echo "FTP root contents: " . implode(", ", array_slice($rootList, 0, 20)) . "\n";

            $appRoots = [];
            if (in_array("artisan", $rootList) || in_array("./artisan", $rootList)) {
                $appRoots[] = "";
            }
            if (in_array("public_html", $rootList) || in_array("./public_html", $rootList)) {
                $appRoots[] = "public_html";
            }
            $cleanTarget = trim($target, "/");
            if (!empty($cleanTarget) && !in_array($cleanTarget, $appRoots)) {
                $appRoots[] = $cleanTarget;
            }
            if (empty($appRoots)) {
                $appRoots = ["", "public_html"];
            }

            // Direct sync of key backend application folders for 100% guarantee
            $appSyncDirs = ["app", "routes", "config", "database"];
            foreach ($appRoots as $root) {
                foreach ($appSyncDirs as $dir) {
                    $local = "backend/" . $dir;
                    $remote = empty($root) ? $dir : ($root . "/" . $dir);
                    if (is_dir($local)) {
                        echo "Direct syncing $local to $remote...\n";
                        upload_dir_recursive($conn, $local, $remote);
                    }
                }

                // Delete stale bootstrap cache files
                $cacheFiles = ["config.php", "routes-v7.php", "routes.php", "packages.php", "services.php"];
                foreach ($cacheFiles as $cf) {
                    $rCache = (empty($root) ? "" : ($root . "/")) . "bootstrap/cache/" . $cf;
                    if (@ftp_delete($conn, $rCache)) {
                        echo "Cleared stale cache file: $rCache\n";
                    }
                }
            }

            // Upload backend.zip
            $zipDest = $target . "backend.zip";
            echo "Uploading backend.zip to $zipDest...\n";
            if (!@ftp_put($conn, $zipDest, "deploy_dist/backend.zip", FTP_BINARY)) {
                @ftp_put($conn, "backend.zip", "deploy_dist/backend.zip", FTP_BINARY);
            }
            echo "backend.zip uploaded successfully!\n";

            // Upload extractor to all candidate locations
            echo "Uploading extract.php...\n";
            $extractCandidates = [
                "public/extract.php",
                "extract.php",
                $target . "public/extract.php",
                $target . "extract.php",
            ];
            $extractUploaded = 0;
            foreach ($extractCandidates as $dest) {
                if (@ftp_put($conn, $dest, "deploy_dist/extract.php", FTP_BINARY)) {
                    echo "Uploaded extractor to $dest\n";
                    $extractUploaded++;
                }
            }
            @ftp_close($conn);
            echo "Direct FTP Code Sync & Upload complete!\n";
          '

          echo "Triggering remote extraction via HTTP..."
          URL="https://api.universalpaints.lk/extract.php?key=universal_paints_deploy_secure_key_2026"
          RESPONSE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL")
          echo "Response: $RESPONSE"
          if [[ "$RESPONSE" == *"SUCCESS"* ]]; then
            echo "✅ Remote extraction completed successfully!"
          else
            echo "Trying alternate URL..."
            ALT_URL="https://api.universalpaints.lk/public/extract.php?key=universal_paints_deploy_secure_key_2026"
            ALT_RESPONSE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$ALT_URL")
            echo "Alt Response: $ALT_RESPONSE"
            if [[ "$ALT_RESPONSE" == *"SUCCESS"* ]]; then
              echo "✅ Remote extraction completed successfully via alternate URL!"
            else
              echo "ℹ️ Direct FTP sync already applied all app code, routes, and config changes directly to disk."
            fi
          fi
          echo "Backend deployment completed successfully!"
