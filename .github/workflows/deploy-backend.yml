name: Deploy API Server (Backend)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, gd, curl
          tools: composer:v2

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: 🗜️ Package Backend to ZIP
        run: |
          mkdir -p deploy_dist/public
          cd backend
          zip -q -r ../deploy_dist/backend.zip . \
            -x ".env*" \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "tests/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"
          cd ..
          cp .github/scripts/remote-extract.php deploy_dist/public/extract.php
          cp .github/scripts/remote-extract.php deploy_dist/extract.php
          echo "ZIP and Extractor prepared successfully:"
          ls -lh deploy_dist/

      - name: 📂 Upload ZIP via Proven FTP Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BACKEND_FTP_SERVER }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ secrets.BACKEND_FTP_TARGET_DIR }}
          state-name: .ftp-zip-deploy-sync-state.json

      - name: 🔍 Verify Remote FTP Files & Trigger Extraction
        run: |
          php -r '
            $s = getenv("BACKEND_FTP_SERVER");
            $u = getenv("BACKEND_FTP_USERNAME");
            $p = getenv("BACKEND_FTP_PASSWORD");
            $t = rtrim(getenv("BACKEND_FTP_TARGET_DIR"), "/") . "/";

            $summary = "### FTP Deployment Diagnostics\n- Target Dir: `$t`\n";
            $c = @ftp_connect($s, 21, 30);
            if (!$c || !@ftp_login($c, $u, $p)) {
              $summary .= "- **FTP Connection Failed!**\n";
            } else {
              @ftp_pasv($c, true);
              $rootFiles = @ftp_nlist($c, $t) ?: [];
              $summary .= "- Root files count: " . count($rootFiles) . "\n";
              $summary .= "```\n" . implode("\n", array_slice($rootFiles, 0, 25)) . "\n```\n";
              
              $pubFiles = @ftp_nlist($c, $t . "public") ?: [];
              $summary .= "- Public files count: " . count($pubFiles) . "\n";
              $summary .= "```\n" . implode("\n", array_slice($pubFiles, 0, 25)) . "\n```\n";
            }
            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), $summary);
          '
          echo "Triggering remote extraction via HTTP..."
          URL="https://api.universalpaints.lk/extract.php?key=universal_paints_deploy_secure_key_2026"
          RESPONSE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL")
          echo "Response: $RESPONSE"
          if [[ "$RESPONSE" == *"SUCCESS"* ]]; then
            echo "✅ Remote extraction completed successfully!"
          else
            echo "Trying alternate URL..."
            ALT_URL="https://api.universalpaints.lk/public/extract.php?key=universal_paints_deploy_secure_key_2026"
            ALT_RESPONSE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$ALT_URL")
            echo "Alt Response: $ALT_RESPONSE"
            if [[ "$ALT_RESPONSE" == *"SUCCESS"* ]]; then
              echo "✅ Remote extraction completed successfully via alternate URL!"
            else
              echo "⚠️ HTTP trigger response did not contain SUCCESS (Cloudflare challenge may be active)."
              echo "The ZIP was uploaded successfully via FTP."
            fi
          fi
        env:
          BACKEND_FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          BACKEND_FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          BACKEND_FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          BACKEND_FTP_TARGET_DIR: ${{ secrets.BACKEND_FTP_TARGET_DIR }}
